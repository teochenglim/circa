# EXAMPLE ONLY - do not apply as-is or commit real secrets to git.
# Copy to 11-secret.yaml, fill in real values, and keep that copy out of
# version control (it's covered by k8s/.gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: circa-secrets
type: Opaque
stringData:
  # Bcrypt-hashed users - merge into config.yaml's auth.users if you enable
  # auth (see DESIGN/08 §8.2). Left empty here to match the no-auth default.
  AUTH_USERS_YAML: |
    # admin: "$2b$12$..."
  # Alert notifier webhook URLs (Slack incoming-webhook, PagerDuty, etc.)
  ALERT_WEBHOOK_URL: ""
  # Iceberg/S3 credentials for backup mode - only needed if features.backup
  # is enabled and this node runs in push mode (see DESIGN/07 §7.3); in pull
  # mode, only the central backup agent needs these, not every node.
  BACKUP_S3_ACCESS_KEY: ""
  BACKUP_S3_SECRET_KEY: ""
