# EXAMPLE ONLY - do not apply as-is or commit real secrets to git.
# Copy to 11-secret.yaml, fill in real values, and keep that copy out of
# version control (it's covered by k8s/.gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: circa-secrets
type: Opaque
stringData:
  # Alert notifier webhook URLs (Slack incoming-webhook, PagerDuty, etc.)
  ALERT_WEBHOOK_URL: ""
  # Iceberg/S3 credentials for backup mode - only needed if features.backup
  # is enabled and this node runs in push mode (see DESIGN/07 §7.3); in pull
  # mode, only the central backup agent needs these, not every node. Names
  # matter: 20-daemonset.yaml dumps this secret's keys verbatim as env vars
  # (no renaming), and internal/backup reads AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY specifically - the AWS SDK's own default
  # credential chain (internal/backup.NewIcebergWriter's doc comment).
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  # Optional - only if the REST catalog itself needs a bearer token
  # separate from S3 auth.
  CIRCA_BACKUP_CATALOG_TOKEN: ""
