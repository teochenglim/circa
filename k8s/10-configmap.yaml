# Non-secret settings, mounted as a file so Circa's single-YAML-config model
# (DESIGN/08 §8.1.1) still holds inside the cluster - no env-var sprawl.
apiVersion: v1
kind: ConfigMap
metadata:
  name: circa-config
data:
  config.yaml: |
    server:
      listen_address: ":9100"

    features:
      collect: true   # built-in self-monitoring (v0.5.0) - zero-config, see 20-daemonset.yaml's HOST_PROC mount
      ml: false
      alerts: false
      backup: false   # to enable: set true and add a `backup:` section here - see config.example.yaml and DESIGN/07; credentials go in 11-secret.yaml, never here
      influx_receive: false
      push_receive: false
      push_send: false

    ingest:
      collect:
        interval: 15s
      # Empty by default - self-collection above already covers this node.
      # Add entries here for additional co-located exporters (this pod runs
      # with hostNetwork, so localhost reaches them), or other hosts entirely.
      scrape:
        targets: []

    storage:
      path: /data
      retention:
        raw: 2h
        minute: 7d
        hour: 365d

    auth: {}   # empty = no auth by default; see 11-secret.example.yaml to enable
