# Circa configuration - single file, feature flags gate every optional
# subsystem. Copy to config.yaml, then: circa --config config.yaml
# (or `circa config init` - see DESIGN/08 §8.1.2).
#
# Circa is a self-monitoring single binary: with no config at all it already
# collects its own host's cpu/memory/disk/network (features.collect, see
# RELEASE/v0.5.0.md) - nothing below is required to see something in the
# dashboard. Anything under a feature's own key (alerting/backup/
# ingest.influx/push/*) is only read if that feature's flag below is true -
# see DESIGN/08_design_config_auth_ops.md. ingest.scrape is the exception:
# it always runs, an empty target list just means no *additional* hosts are
# scraped beyond what circa collects about itself.

server:
  listen_address: ":9100"
  # TLS is optional; if omitted, serves plain HTTP (fine for localhost/trusted networks)

features:
  # Resource cost of each flag, so turning one on is an informed choice, not
  # a surprise (README.md "What each feature flag actually costs", DESIGN/08
  # §8.1.3). The baseline below (collect+scrape+storage+/metrics only) costs
  # no more than node_exporter itself plus a small ring buffer.
  collect: true        # built-in local system metrics - the zero-config default (v0.5.0); negligible cost
  ml: false            # anomaly detection - the one CPU-hungry flag: model_count k-means models
                       # per distinct series, retrained every retrain_interval; scales linearly
                       # with series count x model_count - see DESIGN/10
  alerts: false         # rule engine + notifications - cheap (O(rules) per sample); cost only
                       # shows up as one outbound HTTP call per firing alert (notifier dispatch)
  backup: false         # CDC export to Iceberg - a periodic batch job (per backup.schedule), cost
                       # proportional to rows exported since the last watermark, not continuous
  influx_receive: false # accept InfluxDB line protocol from Telegraf - not implemented yet, see ARCHITECTURE.md
  push_receive: false   # accept incoming remote_write pushes - negligible, one more HTTP route
  push_send: false      # push ingested metrics onward - negligible, one ticker + one HTTP call per interval

ingest:
  collect:                       # only read if features.collect is true (default true)
    interval: 15s
  scrape:                        # always on; empty targets = nothing extra beyond self-collection
    targets: []
    # add entries here to scrape another host or exporter, e.g.:
    # targets:
    #   - url: http://node2:9100/metrics
    #     interval: 15s
    #     labels: { job: node }
  influx:              # only read if features.influx_receive is true
    path: /write

storage:
  path: /var/lib/circa/data
  retention:
    raw: 2h
    minute: 7d
    hour: 365d

alerting:            # only read if features.alerts is true - DESIGN/06 §6.1
  rules:
    - name: high_cpu                         # any unique name
      metric: node_cpu_seconds_total          # metric name to match
      labels: { mode: idle }                  # exact-match label filter; omit to match every series of this metric
      condition:
        type: threshold                       # threshold | rate_of_change | anomaly
        operator: "<"                         # > < >= <= == !=  (threshold/rate_of_change only)
        value: 10
        # window: 5m                          # rate_of_change only - condition compares the per-second rate over this window
      for: 5m                                 # must hold continuously this long before firing (Prometheus-style hysteresis)
      severity: warning                       # info | warning | critical
      notify: [ops-webhook]                   # notifier names below; omit/empty = every configured notifier
    - name: unusual_latency
      metric: http_request_duration_seconds
      condition: { type: anomaly }            # fires when features.ml's anomaly bit is set - see the anomaly: section below
      severity: critical
      notify: [ops-webhook, ops-slack]
  notifiers:
    - name: ops-webhook
      type: webhook                           # webhook | slack
      url: https://example.internal/circa-alerts
    - name: ops-slack
      type: slack
      url: https://hooks.slack.com/services/T000/B000/xxxxxxxxxxxxxxxxxxxxxxxx

anomaly:              # only read if features.ml is true - DESIGN/06 §6.2,
                      # DESIGN/10_ml_summary.md (defaults mirror Netdata's own ml_config.cc)
  model_count: 18            # ensemble size per metric
  training_window: 6h        # history each new model trains on
  retrain_interval: 3h       # how often a new model joins the ensemble
  diff_n: 1                  # order of differencing (0 or 1)
  smooth_n: 3                # rolling-average window after differencing
  lag_n: 5                   # lagged values per feature vector
  score_threshold: 99        # 0..100 - anomaly score cutoff

backup:               # only read if features.backup is true - DESIGN/07, RELEASE/v0.7.0.md
  mode: pull           # push | pull - see DESIGN/07 §7.3 for the tradeoff
  node_id: ""          # identifies this node in exported rows; defaults to os.Hostname() if unset
  # schedule/catalog are only required in mode: push (this process writes to
  # Iceberg itself) or when this file is `circa backup-agent`'s own config
  # (the pull-mode central poller, see backup.nodes below) - a plain
  # mode: pull node just serves GET /api/v1/backup_range and never touches
  # the catalog, so it can leave schedule/catalog unset.
  schedule: "*/15 * * * *"   # cron syntax (github.com/robfig/cron/v3)
  catalog:
    uri: https://iceberg-catalog.internal:8181
    warehouse: s3://metrics-lake/circa
    # s3_endpoint/s3_region are only needed for a self-hosted S3-compatible
    # warehouse (MinIO, etc.) rather than real AWS S3. Credentials are never
    # config fields - set AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (the AWS
    # SDK's own default credential chain) as env vars instead, and
    # CIRCA_BACKUP_CATALOG_TOKEN if the REST catalog itself needs a bearer
    # token separate from S3 auth.
    s3_endpoint: ""
    s3_region: "us-east-1"
  # nodes is only read by `circa backup-agent` (mode: pull's central
  # poller) - the node URLs to pull GET /api/v1/backup_range from. A
  # regular node running mode: pull doesn't read this itself.
  nodes: []
  # nodes:
  #   - url: http://node1.internal:9100
  #     username: ""   # optional, if that node has auth.users set
  #     password: ""

push:
  receive:            # only read if features.push_receive is true
    path: /api/v1/write
  send:                # only read if features.push_send is true
    url: https://central-receiver.internal/api/v1/write
    interval: 30s

auth:
  # absent or empty = no auth (default) - fine for localhost/trusted networks
  users:
    admin: "$2b$12$..."   # bcrypt hash, same convention as Prometheus's exporter-toolkit
    viewer: "$2b$12$..."
