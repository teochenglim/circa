# Default values for the circa chart - see helm/circa/README.md for the
# full reference and DESIGN/08_design_config_auth_ops.md for the config
# model this maps onto.

image:
  # Published by .github/workflows/release.yml's docker job on every
  # tagged release. Override to your own registry/build if you forked or
  # build locally (see helm/circa/README.md and `make docker-build`).
  repository: ghcr.io/teochenglim/circa
  # Empty by default: falls back to .Chart.AppVersion (see
  # helm/circa/templates/daemonset.yaml), which `make bump`/`make release`
  # keeps in sync with VERSION — so a plain `helm upgrade` tracks whatever
  # circa version this chart checkout actually is, not a floating `latest`
  # that could silently drift ahead of what was tested. Set explicitly to
  # pin to something else.
  tag: ""
  pullPolicy: IfNotPresent

listenAddress: ":9100"

# Mirrors config.example.yaml's `features` block. collect is the one
# exception to "every optional subsystem off by default": circa is a
# self-monitoring single binary (v0.5.0+), so this DaemonSet's pods report
# their own node's cpu/memory/disk/network with zero extra config - see
# RELEASE/v0.5.0.md and daemonset.yaml's HOST_PROC mount.
features:
  collect: true
  ml: false
  alerts: false
  backup: false
  influxReceive: false
  pushReceive: false
  pushSend: false

ingest:
  collect:
    interval: 15s
  # Empty by default - self-collection above already covers this node. Add
  # entries here for additional co-located exporters (this DaemonSet runs
  # with hostNetwork, so localhost reaches them) or other hosts entirely; no
  # Circa code change needed. Example:
  #   targets:
  #     - url: http://localhost:9256/metrics   # e.g. a co-located process-exporter
  #       interval: 15s
  #       labels: { job: process }
  scrape:
    targets: []

storage:
  # Node-local hostPath - see helm/circa/README.md for the durability tradeoff.
  hostPath: /var/lib/circa/data
  retention:
    raw: 2h
    minute: 7d
    hour: 365d

# Only read if features.backup is true (off by default). mode: push means
# *this* DaemonSet pod writes to Iceberg directly - see DESIGN/07 and
# RELEASE/v0.7.0.md. Credentials are secrets.* below, not here (never
# commit real catalog/S3 credentials to values.yaml).
# backup:
#   mode: push
#   nodeId: ""              # defaults to the pod's own hostname if unset
#   schedule: "*/15 * * * *"
#   catalog:
#     uri: https://iceberg-catalog.internal:8181
#     warehouse: s3://metrics-lake/circa
#     s3Endpoint: ""        # only for a self-hosted S3-compatible warehouse (MinIO, etc.)
#     s3Region: us-east-1

# Bcrypt-hashed users for basic auth - empty map = no auth (default).
# Set via --set-string or a values override file; never commit real hashes.
auth:
  users: {}

# Populate via --set-string or a separate values-secrets.yaml kept out of
# git. backupS3AccessKey/backupS3SecretKey become AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY in the pod (the AWS SDK's own default credential
# chain, per DESIGN/07 §7.6) - see templates/secret.yaml.
secrets:
  alertWebhookURL: ""
  backupS3AccessKey: ""
  backupS3SecretKey: ""
  backupCatalogToken: "" # optional - only if the REST catalog itself needs a bearer token separate from S3 auth

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

tolerations:
  - operator: Exists
    effect: NoSchedule

# DaemonSet runs with hostNetwork so /metrics is reachable at <node-ip>:9100
# without an extra hop - see helm/circa/README.md.
hostNetwork: true
