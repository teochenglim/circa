apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "circa.fullname" . }}
  labels:
    {{- include "circa.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "circa.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "circa.fullname" . }}
    spec:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: circa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/circa/config.yaml"]
          ports:
            - containerPort: 9100
              hostPort: 9100
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ include "circa.fullname" . }}-secrets
                optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: 9100 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 9100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/circa
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "circa.fullname" . }}-config
        - name: proc
          hostPath: { path: /proc }
        - name: sys
          hostPath: { path: /sys }
        - name: data
          hostPath: { path: {{ .Values.storage.hostPath }}, type: DirectoryOrCreate }
