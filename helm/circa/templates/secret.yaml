# Populated from .Values.secrets - override via --set-string or a
# values-secrets.yaml kept out of git (see helm/circa/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "circa.fullname" . }}-secrets
  labels:
    {{- include "circa.labels" . | nindent 4 }}
type: Opaque
stringData:
  ALERT_WEBHOOK_URL: {{ .Values.secrets.alertWebhookURL | quote }}
  BACKUP_S3_ACCESS_KEY: {{ .Values.secrets.backupS3AccessKey | quote }}
  BACKUP_S3_SECRET_KEY: {{ .Values.secrets.backupS3SecretKey | quote }}
