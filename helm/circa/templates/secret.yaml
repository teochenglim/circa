# Populated from .Values.secrets - override via --set-string or a
# values-secrets.yaml kept out of git (see helm/circa/README.md).
#
# Env var *names* here matter: they're dumped verbatim into the container
# via daemonset.yaml's envFrom (no renaming), and internal/backup reads
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY specifically - the AWS SDK's own
# default credential chain, per DESIGN/07 §7.6's "keep credentials
# centralized, config-light" (see internal/backup.NewIcebergWriter's doc
# comment). A prior version of this file used BACKUP_S3_ACCESS_KEY/
# BACKUP_S3_SECRET_KEY, which internal/backup never actually reads - fixed
# now that push-mode backup is real (v0.7.0), not just decoded-and-unused
# config.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "circa.fullname" . }}-secrets
  labels:
    {{- include "circa.labels" . | nindent 4 }}
type: Opaque
stringData:
  ALERT_WEBHOOK_URL: {{ .Values.secrets.alertWebhookURL | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.backupS3AccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.backupS3SecretKey | quote }}
  CIRCA_BACKUP_CATALOG_TOKEN: {{ .Values.secrets.backupCatalogToken | quote }}
